[package]
name = "marknexia-win32"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "marknexia-win32"
path = "src/main.rs"

[dependencies]
marknexia-core = { path = "../marknexia-core", version = "=0.1.0" }
marknexia-files = { path = "../marknexia-files", version = "=0.1.0" }
marknexia-navigation = { path = "../marknexia-navigation", version = "=0.1.0" }
marknexia-rendering = { path = "../marknexia-rendering", version = "=0.1.0" }
marknexia-security = { path = "../marknexia-security", version = "=0.1.0" }
marknexia-update = { path = "../marknexia-update", version = "=0.1.0" }
marknexia-webview = { path = "../marknexia-webview", version = "=0.1.0" }
serde_json.workspace = true
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# PrintWindow for the native high-contrast palette gate (tests only).
windows = { version = "=0.62.2", features = ["Win32_Storage_Xps"] }
