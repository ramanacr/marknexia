[package]
name = "marknexia-win32"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "marknexia-win32"
path = "src/main.rs"

[dependencies]
marknexia-core = { path = "../marknexia-core", version = "=0.1.0" }
marknexia-webview = { path = "../marknexia-webview", version = "=0.1.0" }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
