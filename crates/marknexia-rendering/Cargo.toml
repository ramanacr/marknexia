[package]
name = "marknexia-rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
marknexia-core = { path = "../marknexia-core", version = "=0.1.0" }
marknexia-markdown = { path = "../marknexia-markdown", version = "=0.1.0" }
marknexia-security = { path = "../marknexia-security", version = "=0.1.0" }
# Already in the tree through html5ever/ammonia; used only for its HTML5
# named-character-reference table (WebUtility.HtmlDecode emulation).
markup5ever = "=0.40.0"

[dev-dependencies]
serde_json = { workspace = true }

[features]
# Lets `--all-features` run the rendering parity gate on both Markdown
# candidates; the default candidate is whatever marknexia-markdown defaults to.
candidate-comrak = ["marknexia-markdown/candidate-comrak"]
