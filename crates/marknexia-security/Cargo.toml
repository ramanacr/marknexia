[package]
name = "marknexia-security"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
marknexia-core = { path = "../marknexia-core", version = "=0.1.0" }
ammonia = "=4.2.4"
cssparser = { version = "=0.38.0", default-features = false }
html5ever = "=0.40.1"
serde = { workspace = true }
url = "=2.5.8"

[dev-dependencies]
serde_json = { workspace = true }

[lints.rust]
# Set for the whole build in .cargo/config.toml; ammonia exposes its DOM only
# under it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ammonia_unstable)"] }
