name: Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Calculate & Sync Version
        shell: pwsh
        run: |
          ./scripts/set-version.ps1 -SyncManifestOnly

      - name: Restore Dependencies
        run: dotnet restore Marknexia.slnx

      - name: Build Application (Release)
        run: msbuild Marknexia.slnx /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Package Distribution Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "1.0.0" }
          $zipName = "Marknexia-v$ver-win-x64.zip"
          $publishDir = "src/Marknexia.App/bin/Release/net10.0-windows10.0.19041.0"
          Compress-Archive -Path "$publishDir/*" -DestinationPath "$zipName" -Force
          Get-FileHash -Path "$zipName" -Algorithm SHA256 | Out-File -FilePath "$zipName.sha256"
