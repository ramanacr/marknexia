name: Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node for Browser Regression Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/Marknexia.Bridge.Tests/package-lock.json

      - name: Test Rendered Document Bridge
        working-directory: tests/Marknexia.Bridge.Tests
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Calculate & Sync Version
        shell: pwsh
        run: |
          ./scripts/set-version.ps1 -SyncManifestOnly

      - name: Restore Dependencies
        run: dotnet restore Marknexia.slnx

      - name: Run .NET Regression Suite
        run: dotnet test Marknexia.slnx --configuration Release --no-restore --verbosity normal

      - name: Build Application (Release)
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release ref '$releaseVersion' must be a three-component semantic version such as 1.0.12."
          }
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          ./scripts/Test-Sbom.ps1
          ./scripts/Build-App.ps1 -Configuration Release -Platform x64 -Version $releaseVersion -NoRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Build-App.ps1 -Configuration Release -Platform ARM64 -Version $releaseVersion -NoRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Distribution Zip and MSIX
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag '$ver' must be a three-component semantic version such as 1.0.12."
          }
          $packageVersion = "$ver.0"
          $packages = @(
            [pscustomobject]@{ Platform = "x64"; AssetToken = "x64" },
            [pscustomobject]@{ Platform = "ARM64"; AssetToken = "arm64" }
          )

          foreach ($package in $packages) {
            $publishDir = "src/Marknexia.App/bin/$($package.Platform)/Release/net10.0-windows10.0.19041.0"
            if (-not (Test-Path "$publishDir/Marknexia.App.exe")) {
              throw "Release output was not found for $($package.Platform): $publishDir"
            }

            $zipName = "Marknexia-v$ver-win-$($package.AssetToken).zip"
            $msixName = "Marknexia-v$ver-win-$($package.AssetToken).msix"
            Compress-Archive -Path "$publishDir/*" -DestinationPath $zipName -Force
            Get-FileHash -Path $zipName -Algorithm SHA256 | Out-File -FilePath "$zipName.sha256"

            ./scripts/prepare-store-package.ps1 -Platform $package.Platform -Version $packageVersion
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $preparedName = if ($package.Platform -eq "x64") { "Marknexia-Store-Ready.msix" } else { "Marknexia-Store-Ready-ARM64.msix" }
            Copy-Item "store-submission/$preparedName" -Destination $msixName -Force
            Get-FileHash -Path $msixName -Algorithm SHA256 | Out-File -FilePath "$msixName.sha256"

            ./scripts/Build-Installer.ps1 -Configuration Release -Platform $package.Platform -Version $ver -OutputDirectory "." -NoRestore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Marknexia-*.zip
            Marknexia-*.zip.sha256
            Marknexia-*.msix
            Marknexia-*.msix.sha256
            Marknexia-*-setup.exe
            Marknexia-*-setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
