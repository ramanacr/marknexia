name: Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build, test and upload unsigned app output
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node for Browser Regression Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/Marknexia.Bridge.Tests/package-lock.json

      - name: Test Rendered Document Bridge
        working-directory: tests/Marknexia.Bridge.Tests
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Calculate & Sync Version
        shell: pwsh
        run: |
          ./scripts/set-version.ps1 -Version "${{ github.ref_name }}" -SyncManifestOnly

      - name: Restore Dependencies
        run: dotnet restore Marknexia.slnx

      - name: Run .NET Regression Suite
        run: dotnet test Marknexia.slnx --configuration Release --no-restore --verbosity normal

      - name: Build Application (Release)
        shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release ref '$releaseVersion' must be a three-component semantic version such as 1.0.12."
          }
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          ./scripts/Test-Sbom.ps1
          ./scripts/Build-App.ps1 -Configuration Release -Platform x64 -Version $releaseVersion -NoRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Build-App.ps1 -Configuration Release -Platform ARM64 -Version $releaseVersion -NoRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Stage 1 of the local signing flow (docs/release-signing.md). The app output is
      # uploaded unsigned and nothing is published here: the owner signs the binaries on
      # their PC, the "Signed packages" workflow builds the setup, ZIP and MSIX from them,
      # and the owner signs and publishes the v* release. A tag push therefore no longer
      # creates a GitHub release by itself, so the updater never sees unsigned files.
      - name: Upload unsigned x64 app output for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marknexia-dotnet-UNSIGNED-app-x64
          path: src/Marknexia.App/bin/x64/Release/net10.0-windows10.0.19041.0/
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned ARM64 app output for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marknexia-dotnet-UNSIGNED-app-arm64
          path: src/Marknexia.App/bin/ARM64/Release/net10.0-windows10.0.19041.0/
          if-no-files-found: error
          retention-days: 14